<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - KSS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #080b10;
            color: #fff;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 520px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            color: #ff0033;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 72px;
            margin: 0;
        }

        h2 {
            margin: 10px 0;
            font-size: 26px;
        }

        p {
            color: #9ca7b4;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            background: #ff0033;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            background: #d9002b;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">KSS</div>

        <h1>404</h1>

        <h2>Page not found</h2>

        <p>
            Sorry, the page you're looking for doesn't exist
            or may have been moved.
        </p>

        <a href="{{ url_for('index') }}">
            Go to KSS Home
        </a>

    </div>

</body>
</html>
