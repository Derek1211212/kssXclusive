<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KSS — Payment Failed</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background: #071014;
            color: #f5f8f9;
            font-family:
                Inter,
                system-ui,
                sans-serif;
        }

        .box {
            width: min(500px, 100%);
            text-align: center;
            background: #0d191e;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            padding: 45px 30px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255,107,107,.12);
            color: #ff7d7d;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #9aadb4;
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        a {
            flex: 1;
            text-decoration: none;
            padding: 14px;
            border-radius: 11px;
            font-weight: 800;
        }

        .primary {
            background: #16c6b4;
            color: #04100f;
        }

        .secondary {
            background: rgba(255,255,255,.06);
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">
        !
    </div>

    <h1>Payment unsuccessful</h1>

    <p>
        We could not confirm your payment.
        No access has been granted for this transaction.
    </p>

    {% if reference %}
        <p style="font-size:12px;">
            Reference: {{ reference }}
        </p>
    {% endif %}

    <div class="buttons">

        <a
            class="primary"
            href="{{ url_for('dashboard') }}"
        >
            My Dashboard
        </a>

        <a
            class="secondary"
            href="{{ url_for('index') }}"
        >
            Browse Videos
        </a>

    </div>

</div>

</body>
</html>
